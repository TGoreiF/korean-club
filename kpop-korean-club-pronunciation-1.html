/* ---- Hangul lab: letters, block diagrams, builder ---- */
.hl-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:16px;background:#e9e3f7}
.hl-seg-btn{min-height:46px;border-radius:12px;padding:0 8px;font-size:14px;font-weight:800;color:#211b3b;background:transparent}
.hl-seg-btn.is-on{background:#fff;box-shadow:0 2px 8px rgba(33,27,59,.16);color:#5b3df5}
.hl-c,.hl-v,.hl-b{border-radius:8px}
.hl-c{background:#ffe6f1;color:#8a2458}
.hl-v{background:#e9e4ff;color:#3b27a8}
.hl-b{background:#e5f7ee;color:#0e6a48}
.hl-steps{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.hl-steps>li{display:grid;gap:4px;padding:12px;border:1px solid #e6e0f2;border-radius:14px;background:#f6f3fb}
.hl-steps>li>b{font-size:16px;font-weight:800}
.hl-steps>li>span{font-size:15px;color:#4d4565}
.hl-steps>li>em{justify-self:start;padding:4px 10px;border-radius:10px;background:#fff6d6;font-style:normal;font-weight:800;font-size:15px}
.hl-cards{display:grid;gap:10px;margin-top:8px}
@media (min-width:700px){.hl-cards{grid-template-columns:repeat(3,1fr)}}
.hl-card{padding:12px;border:1px solid #e6e0f2;border-radius:14px;background:#fff}
.hl-card>b{font-weight:800}
.hl-card>p{margin:4px 0 10px;font-size:14px;color:#4d4565}
.hl-pair{display:flex;align-items:center;justify-content:center;gap:8px}
.hl-pairbtn{display:grid;justify-items:center;gap:4px;min-height:44px;padding:4px;border-radius:12px;background:transparent;font-size:28px;font-weight:900;line-height:1.1}
.hl-plus{font-size:15px;font-weight:800;color:#675f80}
.hl-legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.hl-key{padding:4px 10px;font-size:12px;font-weight:800}
.hl-blk{display:grid;gap:3px;width:88px;height:88px;flex:none;padding:4px;border:2px solid #e6e0f2;border-radius:14px;background:#fff;font-size:24px;font-weight:900;line-height:1}
.hl-blk>span{display:grid;place-items:center;min-width:0;border-radius:8px}
.hl-blk .hl-c{grid-area:c}
.hl-blk .hl-v{grid-area:v}
.hl-blk .hl-w{grid-area:w}
.hl-blk .hl-b{grid-area:b}
.hl-right{grid-template-columns:1fr 1fr;grid-template-rows:1fr;grid-template-areas:"c v"}
.hl-right.has-b{grid-template-rows:1fr .7fr;grid-template-areas:"c v" "b b"}
.hl-below{grid-template-columns:1fr;grid-template-rows:1fr 1fr;grid-template-areas:"c" "v"}
.hl-below.has-b{grid-template-rows:1fr 1fr .8fr;grid-template-areas:"c" "v" "b"}
.hl-wrap{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"c v" "w w"}
.hl-wrap.has-b{grid-template-rows:1fr 1fr .8fr;grid-template-areas:"c v" "w w" "b b"}
.hl-bar{position:sticky;top:150px;z-index:10;display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px;border:1px solid #e6e0f2;border-radius:16px;background:#fff;box-shadow:0 8px 20px rgba(33,27,59,.16)}
.hl-glyph{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:14px;background:#211b3b;color:#fff;font-size:40px;font-weight:900;line-height:1}
.hl-bartext{flex:1;min-width:0}
.hl-formula{margin:0;font-size:18px;font-weight:900}
.hl-formula>span{padding:1px 7px}
.hl-sound{margin:2px 0 0;font-size:13px;font-weight:800;color:#5b3df5}
.hl-detail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px}
.hl-hint{flex:1 1 170px;margin:0;font-size:14px;color:#4d4565}
.hl-h{margin:16px 0 0;font-size:13px;font-weight:800;letter-spacing:.1em;color:#675f80}
.hl-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hl-chip{min-width:44px;min-height:44px;padding:0 10px;border:1px solid #e6e0f2;border-radius:12px;background:#fff;color:#211b3b;font-size:22px;font-weight:900;line-height:1}
.hl-chip:not([lang]){font-size:14px;font-weight:800}
.hl-chip.is-w{font-size:20px}
.hl-chip[aria-pressed="true"]{color:#fff}
.hl-chip.is-c[aria-pressed="true"]{background:#b4236a;border-color:#b4236a}
.hl-chip.is-v[aria-pressed="true"]{background:#5b3df5;border-color:#5b3df5}
.hl-chip.is-b[aria-pressed="true"]{background:#0e6a48;border-color:#0e6a48}
.hl-chip.is-w[aria-pressed="true"]{background:#211b3b;border-color:#211b3b}
.hl-blocks{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.hl-bcard{display:grid;justify-items:center;gap:3px;min-width:96px;padding:10px 12px;border:1px solid #e6e0f2;border-radius:14px;background:#f6f3fb}
.hl-bglyph{font-size:46px;font-weight:900;line-height:1.1}
.hl-bparts{display:flex;align-items:center;gap:3px;font-size:16px;font-weight:900}
.hl-bparts>span{padding:1px 7px;border-radius:7px}
.hl-bsound{font-size:12px;font-weight:800;color:#675f80}
.hl-sent{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hl-sent>div{display:grid;align-content:start;justify-items:center;gap:2px;padding:10px 6px;border:1px solid #e6e0f2;border-radius:14px;background:#f6f3fb;text-align:center}
.hl-sent b{font-size:22px;font-weight:900}
.hl-sent b i{font-style:normal;color:#b4236a}
.hl-sent span{font-weight:800}
.hl-sent small{font-size:12px;color:#675f80}
</style>

<script id="pronunciation-studio-addon">
(function(){
  if (window.__pronunciationStudioInstalled) return;
  window.__pronunciationStudioInstalled = true;
  const style = document.createElement('style');
  style.textContent = `
  #pron-studio-launch{position:fixed;right:14px;bottom:18px;z-index:9998;border:0;border-radius:999px;padding:13px 17px;background:#b4236a;color:#fff;font:800 15px system-ui;box-shadow:0 5px 22px #211b3b35}
  #pron-studio-backdrop{position:fixed;inset:0;z-index:9999;background:#17122bcc;display:none;align-items:flex-end;justify-content:center;padding:12px}
  #pron-studio{width:min(620px,100%);max-height:92dvh;overflow:auto;background:#f6f3fb;color:#211b3b;border-radius:24px;padding:18px;box-shadow:0 10px 45px #0005;font-family:system-ui,sans-serif}
  #pron-studio h2{font-size:24px;font-weight:900;margin:0 0 4px} #pron-studio p{margin:5px 0 12px;color:#675f80}
  #pron-studio label{display:block;font-weight:800;margin:12px 0 5px}
  #pron-studio input{width:100%;padding:12px;border:1px solid #d9d0ed;border-radius:12px;background:white;font-size:18px;color:#211b3b}
  #pron-studio .ps-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  #pron-studio button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;background:#5b3df5;color:white}
  #pron-studio button.ps-light{background:white;color:#211b3b;border:1px solid #e6e0f2}
  #pron-studio button.ps-record{background:#b4236a}
  #pron-studio button:disabled{opacity:.45}
  #pron-studio .ps-korean{font-size:34px;font-weight:900;text-align:center;padding:10px;overflow-wrap:anywhere}
  #pron-studio .ps-status{padding:12px;border-radius:12px;background:#fff6d6;color:#59450a;font-weight:700;min-height:44px}
  #pron-studio audio{width:100%;margin-top:8px} #pron-studio .ps-close{float:right;background:transparent;color:#211b3b;font-size:25px;padding:0 6px}
  @media(min-width:600px){#pron-studio-backdrop{align-items:center}}
  `;
  document.head.appendChild(style);
  const launch=document.createElement('button');
  launch.id='pron-studio-launch';launch.type='button';launch.textContent='🎙 Pronunciation Studio';
  document.body.appendChild(launch);
  const backdrop=document.createElement('div');backdrop.id='pron-studio-backdrop';
  backdrop.innerHTML=`<section id="pron-studio" role="dialog" aria-modal="true" aria-labelledby="ps-title">
    <button class="ps-close" id="ps-close" aria-label="Close">×</button>
    <h2 id="ps-title">Pronunciation Studio ✨</h2>
    <p>Listen, record, play back, and check each Korean word or phrase. Recordings stay in this page and are not uploaded.</p>
    <label for="ps-target">Korean word or phrase</label>
    <input id="ps-target" lang="ko" value="안녕하세요" autocomplete="off" autocapitalize="off">
    <label for="ps-roman">Romanization (optional)</label>
    <input id="ps-roman" placeholder="e.g. annyeonghaseyo">
    <div class="ps-korean" id="ps-preview" lang="ko">안녕하세요</div>
    <div class="ps-actions">
      <button id="ps-hear" type="button">🔊 Hear Korean</button>
      <button id="ps-record" class="ps-record" type="button">● Record me</button>
      <button id="ps-stop" class="ps-light" type="button" disabled>■ Stop</button>
    </div>
    <audio id="ps-playback" controls hidden></audio>
    <div class="ps-actions"><button id="ps-check" type="button">🎧 Check pronunciation</button><button id="ps-copy-target" class="ps-light" type="button">Use selected lesson phrase</button></div>
    <div class="ps-status" id="ps-status" role="status" aria-live="polite">Tap Hear Korean first, then record your voice.</div>
    <p style="font-size:12px;margin-top:10px">Pronunciation check uses your browser's Korean speech recognition, when available. It checks which words were recognized, not every sound perfectly. Use a secure page (HTTPS) and allow microphone access when prompted.</p>
  </section>`;
  document.body.appendChild(backdrop);
  const $=id=>document.getElementById(id), target=$('ps-target'), preview=$('ps-preview'), status=$('ps-status');
  let recorder=null, chunks=[], stream=null, audioUrl=null, recording=false;
  function setStatus(t){status.textContent=t}
  function norm(s){return (s||'').normalize('NFC').toLowerCase().replace(/[\s.,?!~…·\-_'’"“”‘’]/g,'').replace(/[^\u1100-\u11ff\u3130-\u318f\uac00-\ud7a3a-z0-9]/g,'')}
  function update(){preview.textContent=target.value||'한국어';}
  target.addEventListener('input',update);
  function open(){backdrop.style.display='flex';const selected=document.querySelector('[lang="ko"].text-4xl, [lang="ko"].text-5xl');if(selected&&selected.textContent.trim()&&!selected.textContent.includes('___'))target.value=selected.textContent.trim();update();setStatus('Tap Hear Korean first, then record your voice.');}
  function close(){if(recording)stopRecording();backdrop.style.display='none'}
  launch.addEventListener('click',open);$('ps-close').addEventListener('click',close);
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&backdrop.style.display==='flex')close()});
  $('ps-hear').addEventListener('click',()=>{
    const phrase=target.value.trim(); if(!phrase){setStatus('Enter a Korean word or phrase first.');return}
    if(!('speechSynthesis' in window)){setStatus('Text-to-speech is not available in this browser.');return}
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(phrase);u.lang='ko-KR';u.rate=.78;
    const voices=speechSynthesis.getVoices();const ko=voices.find(v=>/^ko(-|$)/i.test(v.lang));if(ko)u.voice=ko;
    u.onstart=()=>setStatus('Playing the Korean example…');u.onend=()=>setStatus('Your turn! Record yourself, then play it back.');u.onerror=()=>setStatus('Could not play audio. Check the device volume and browser audio settings.');speechSynthesis.speak(u);
  });
  async function stopRecording(){
    if(recorder&&recorder.state!=='inactive'){recorder.stop();}
    recording=false;$('ps-record').disabled=false;$('ps-stop').disabled=true;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  }
  $('ps-record').addEventListener('click',async()=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){setStatus('Audio recording is not supported here. Open the app in Chrome on an HTTPS page and try again.');return}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];let mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
      recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
      recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
        if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);
        const player=$('ps-playback');player.src=audioUrl;player.hidden=false;
        setStatus('Recording saved temporarily in this page. Tap Play on the audio player to hear yourself, or run Check pronunciation.');
      };
      recorder.start();recording=true;$('ps-record').disabled=true;$('ps-stop').disabled=false;
      setStatus('🔴 Recording… say the Korean phrase clearly, then tap Stop.');
    }catch(e){setStatus(e&&e.name==='NotAllowedError'?'Microphone permission was denied. Allow microphone access for this page in your browser settings, then try again.':'Could not start recording. Check the microphone connection and browser permissions.');}
  });
  $('ps-stop').addEventListener('click',stopRecording);
  $('ps-check').addEventListener('click',()=>{
    const expected=target.value.trim();if(!expected){setStatus('Enter the Korean word or phrase you want to practice.');return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setStatus('This browser does not support Korean speech recognition. Recording and playback still work. Try Chrome or Edge for the check.');return}
    const rec=new SR();rec.lang='ko-KR';rec.interimResults=false;rec.maxAlternatives=5;
    $('ps-check').disabled=true;setStatus('Listening for your pronunciation now. Say: '+expected);
    rec.onresult=e=>{
      const alternatives=Array.from(e.results[0]||[]).map(x=>x.transcript.trim()).filter(Boolean);
      const heard=alternatives[0]||'';
      if(norm(heard)===norm(expected)){setStatus('🌟 The browser recognized the target phrase! Great work.');}
      else if(alternatives.some(x=>norm(x)===norm(expected))){setStatus('🌟 The target phrase appears in the recognition alternatives. Nice work!')}
      else if(heard){setStatus('I heard: “'+heard+'”. Target: “'+expected+'”. Listen to the example and try again. (Speech recognition can make mistakes.)')}
      else{setStatus('I did not catch a clear phrase. Move closer to the microphone and try again.')}
    };
    rec.onerror=e=>{setStatus(e.error==='not-allowed'?'Microphone permission was denied. Allow microphone access and try again.':e.error==='no-speech'?'No speech detected. Tap Check pronunciation and speak right away.':'The speaking check could not run ('+e.error+'). Recording and playback are still available.');};
    rec.onend=()=>{$('ps-check').disabled=false};
    try{rec.start()}catch(e){$('ps-check').disabled=false;setStatus('Could not start speech recognition. Try again.')}
  });
  $('ps-copy-target').addEventListener('click',()=>{
    const candidates=[...document.querySelectorAll('[lang="ko"]')].filter(el=>el.offsetParent!==null).map(el=>el.textContent.trim()).filter(t=>t&&t.length<100&&!t.includes('___'));
    const phrase=candidates.find(t=>/[\uac00-\ud7a3]/.test(t)&&t.length>1);
    if(phrase){target.value=phrase;update();setStatus('Loaded a Korean phrase visible in the current lesson.');}
    else setStatus('Open a lesson or Speak and listen section first, then tap this button again. You can also type any Korean word above.');
  });
  window.addEventListener('beforeunload',()=>{if(audioUrl)URL.revokeObjectURL(audioUrl);if(stream)stream.getTracks().forEach(t=>t.stop())});
})();
</script>
